<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>견적서 미리 보기</title>
    <style>
      :root { --ink:#1f2933; --muted:#69727d; --paper:#ffffff; --bg:#f4f1eb; --line:#e2ded5; --accent:#d45b35; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; padding:32px; color:var(--ink); background:var(--bg); font-family:'Noto Sans KR','Malgun Gothic',sans-serif; }
      .container { width:min(100%,900px); margin:0 auto; }
      .topbar { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:22px; }
      .eyebrow { margin:0 0 6px; color:var(--accent); font-size:.72rem; font-weight:700; letter-spacing:.12em; }
      h1 { margin:0; font-size:clamp(1.7rem,4vw,2.3rem); letter-spacing:-.06em; }
      .actions { display:flex; gap:10px; }
      .btn { border:1px solid var(--line); border-radius:6px; padding:9px 13px; background:var(--paper); color:var(--ink); cursor:pointer; font:inherit; font-size:.84rem; font-weight:600; line-height:1.2; white-space:nowrap; text-decoration:none; }
      .paper { width:210mm; min-height:297mm; margin:0 auto; padding:16mm; border:1px solid var(--line); border-radius:4px; background:var(--paper); box-shadow:0 18px 50px rgba(24,33,43,.08); }
      .document-title { margin:0 0 20px; text-align:center; font-size:1.85rem; letter-spacing:.16em; }
      .document-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:16px; }
      .document-subject { font-size:.92rem; font-weight:700; }
      .document-info { display:grid; gap:4px; color:var(--muted); font-size:.78rem; text-align:right; }
      .document-info strong { color:var(--ink); font-weight:700; }
      .parties { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); margin-bottom:22px; }
      .party { min-width:0; border:1px solid var(--line); }
      .party + .party { border-left:0; }
      .party-title { padding:9px 12px; background:#f6f8fa; border-bottom:1px solid var(--line); font-weight:700; }
      .party-body { display:grid; gap:8px; padding:12px; min-height:92px; font-size:.84rem; }
      .supplier-party .party-body { position:relative; padding-right:12px; }
      .party-line { display:grid; grid-template-columns:72px minmax(0, 1fr); gap:8px; min-width:0; }
      .party-line span:first-child { color:var(--muted); }
      .supplier-party .party-line span:last-child { white-space:normal; overflow-wrap:anywhere; font-size:.72rem; }
      .supplier-party .supplier-address span:last-child { white-space:nowrap; font-size:.66rem; letter-spacing:-.03em; }
      .supplier-stamp { position:absolute; top:-11px; right:10px; width:96px; height:96px; object-fit:contain; }
      .table-title { margin:0 0 8px; font-size:1rem; }
      table { width:100%; border-collapse:collapse; border-top:2px solid var(--ink); }
      th, td { padding:7px 6px; text-align:left; border-bottom:1px solid var(--line); font-size:.76rem; }
      th { background:#f6f8fa; font-size:.7rem; font-weight:700; text-align:center; }
      td:nth-child(1), td:nth-child(4) { text-align:center; }
      td:nth-child(5), td:nth-child(6) { text-align:right; white-space:nowrap; }
      .amount-summary { display:grid; grid-template-columns:1fr 1fr 1fr; margin-top:14px; border:1px solid var(--line); }
      .amount-item { padding:3px 10px; border-right:1px solid var(--line); }
      .amount-item:last-child { border-right:0; background:#f6f8fa; }
      .amount-label { display:block; margin-bottom:2px; color:var(--muted); font-size:.66rem; line-height:1.1; }
      .amount-value { font-size:.84rem; font-weight:700; line-height:1.1; text-align:right; }
      .note { min-height:80px; margin-top:22px; padding:12px; border:1px solid #b9b5ac; white-space:pre-wrap; font-size:.84rem; }
      .message { padding:30px; color:var(--muted); text-align:center; }
      @media (max-width:650px) { body { padding:20px; } .topbar { align-items:flex-start; flex-direction:column; } .parties, .signature, .amount-summary { grid-template-columns:1fr; } .party + .party { border-left:1px solid var(--ink); border-top:0; } .amount-item { border-right:0; border-bottom:1px solid var(--ink); } .amount-item:last-child { border-bottom:0; } .paper { width:100%; min-height:auto; padding:18px; } table { display:block; overflow-x:auto; white-space:nowrap; } }
      @page { size:A4; margin:0; }
      @media print { body { padding:0; background:#fff; } .topbar { display:none; } .paper { width:210mm; min-height:297mm; margin:0; padding:16mm; border:0; border-radius:0; box-shadow:none; } }
    </style>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <main class="container">
      <header class="topbar">
        <div><p class="eyebrow" id="previewEyebrow">QUOTATION PREVIEW</p><h1 id="previewTitle">견적서 미리 보기</h1></div>
        <div class="actions"><a class="btn" id="backLink" href="admin.html">관리자 홈</a><button class="btn" id="reissueBtn" style="display:none;">수정해서 재발행</button><button class="btn" id="downloadBtn">다운로드</button><button class="btn" id="pdfBtn">PDF 다운로드</button></div>
      </header>
      <section class="paper" id="quotationPaper"><div class="message">견적서를 불러오는 중입니다.</div></section>
    </main>
    <script>
      const API_BASE_URL = window.location.origin;
      const USER_KEY = 'demo-login-user';
      const user = JSON.parse(localStorage.getItem(USER_KEY) || 'null');
      const paper = document.getElementById('quotationPaper');
      if (!user) window.location.href = 'index.html';
      if (user && user.email !== 'ainsonicav@gmail.com' && user.role !== 'admin') { alert('관리자만 접근할 수 있습니다.'); window.location.href = 'index.html'; }
      const quotationId = new URLSearchParams(window.location.search).get('id');
      const isDraftPreview = new URLSearchParams(window.location.search).get('draft') === '1';
      const formatPrice = (value) => `${Number(value || 0).toLocaleString('ko-KR')}원`;
      const safeFilePart = (value) => String(value || '').trim().replace(/[\\/:*?"<>|]/g, '-').replace(/\s+/g, ' ');
      let quotationData = null;
      let downloadFileName = '';
      async function loadQuotation() {
        let quotation;
        if (isDraftPreview) {
          quotation = JSON.parse(localStorage.getItem('quotation-preview-draft') || 'null');
          if (!quotation) throw new Error('작성 중인 견적서가 없습니다.');
        } else {
          if (!quotationId) throw new Error('견적서 번호가 없습니다.');
          const response = await fetch(`${API_BASE_URL}/api/quotations/${quotationId}`);
          const data = await response.json();
          if (!response.ok) throw new Error(data.message || '견적서를 불러오지 못했습니다.');
          quotation = data.quotation;
        }
        quotationData = quotation;
        document.getElementById('previewEyebrow').textContent = isDraftPreview ? 'DRAFT PREVIEW' : 'ISSUED QUOTATION';
        document.getElementById('previewTitle').textContent = isDraftPreview ? '작성 중 견적서 미리 보기' : '발행 견적서 미리 보기';
        document.title = isDraftPreview ? '작성 중 견적서 미리 보기' : '발행 견적서 미리 보기';
        const backLink = document.getElementById('backLink');
        backLink.href = isDraftPreview ? 'quotation.html' : 'admin.html';
        backLink.textContent = isDraftPreview ? '견적서 작성으로 돌아가기' : '관리자 홈';
        const reissueButton = document.getElementById('reissueBtn');
        reissueButton.style.display = isDraftPreview ? 'none' : 'inline-block';
        downloadFileName = [quotation.issue_date || new Date().toISOString().slice(0, 10), quotation.subject || '견적서', quotation.customer_name || '고객사'].map(safeFilePart).join('_');
        if (isDraftPreview) downloadFileName = `작성중_${downloadFileName}`;
        const supplyAmount = Number(quotation.total_amount || 0);
        const vatAmount = Math.round(supplyAmount * 0.1);
        const grandTotal = supplyAmount + vatAmount;
        paper.innerHTML = `
          <h2 class="document-title">견 적 서</h2>
          <div class="document-head"><span class="document-subject">건명: ${quotation.subject || '음향·영상장비 설계 및 설치'}</span><div class="document-info"><span>견적서번호: <strong>#${quotation.id}</strong></span><span>발행일: <strong>${quotation.issue_date || '-'}</strong></span></div></div>
          <div class="parties">
            <div class="party"><div class="party-title">공급받는자</div><div class="party-body">
              <div class="party-line"><span>상호/회사명</span><strong>${quotation.customer_name || '-'}</strong></div>
              <div class="party-line"><span>담당자</span><span>${quotation.contact_name || '-'}</span></div>
              <div class="party-line"><span>연락처</span><span>${quotation.contact_phone || '-'}</span></div>
              <div class="party-line"><span>이메일</span><span>${quotation.contact_email || '-'}</span></div>
            </div></div>
            <div class="party supplier-party"><div class="party-title">공급자</div><div class="party-body">
              <div class="party-line"><span>상호</span><strong>아인소닉</strong></div>
              <div class="party-line"><span>사업자번호</span><span>750-11-00912</span></div>
              <div class="party-line supplier-address"><span>주소</span><span>경기도 안산시 상록구 예술광장1로 상가동 106호</span></div>
              <div class="party-line"><span>연락처</span><span>010-3599-6733</span></div>
              <img class="supplier-stamp" src="stamp.png" alt="아인소닉 도장" />
            </div></div>
          </div>
          <h3 class="table-title">품목 및 사양</h3>
          <table><thead><tr><th style="width:8%">No.</th><th style="width:22%">품목</th><th>사양</th><th style="width:13%">수량</th><th style="width:18%">단가</th><th style="width:18%">금액</th></tr></thead><tbody>
            ${quotation.items.map((item, index) => `<tr><td style="text-align:center">${index + 1}</td><td>${item.product_category || '-'}</td><td>${item.product_name}</td><td>${item.quantity}</td><td>${formatPrice(item.unit_price)}</td><td>${formatPrice(item.amount)}</td></tr>`).join('')}
          </tbody></table>
          <div class="amount-summary"><div class="amount-item"><span class="amount-label">공급가액</span><div class="amount-value">${formatPrice(supplyAmount)}</div></div><div class="amount-item"><span class="amount-label">부가세 (10%)</span><div class="amount-value">${formatPrice(vatAmount)}</div></div><div class="amount-item"><span class="amount-label">합계 금액</span><div class="amount-value">${formatPrice(grandTotal)}</div></div></div>
          <div class="note"><strong>비고 및 특이사항</strong><br>${quotation.note || '특이사항 없음'}</div>
        `;
      }
      async function imageToDataUrl(url) {
        const response = await fetch(url);
        const blob = await response.blob();
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      document.getElementById('downloadBtn').addEventListener('click', async () => {
        if (!quotationData) return;
        const currentStyles = document.querySelector('style').textContent;
        const stampDataUrl = await imageToDataUrl('stamp.png');
        const exportedMarkup = paper.innerHTML.replace(/src="stamp\.png"/g, `src="${stampDataUrl}"`);
        const file = new Blob([`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${downloadFileName}</title><style>${currentStyles}</style></head><body style="margin:0;background:#fff;"><main class="container"><section class="paper">${exportedMarkup}</section></main></body></html>`], { type: 'text/html;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(file);
        link.download = `${downloadFileName}.html`;
        link.click();
        URL.revokeObjectURL(link.href);
      });
      document.getElementById('pdfBtn').addEventListener('click', () => {
        if (!quotationData) return;
        const previousTitle = document.title;
        document.title = downloadFileName;
        window.print();
        setTimeout(() => { document.title = previousTitle; }, 1000);
      });
      document.getElementById('reissueBtn').addEventListener('click', () => {
        if (!quotationData) return;
        localStorage.setItem('quotation-preview-draft', JSON.stringify(quotationData));
        window.location.href = 'quotation.html?reissue=1';
      });
      loadQuotation().catch((error) => { paper.innerHTML = `<div class="message">${error.message}</div>`; });
    </script>
  </body>
</html>
